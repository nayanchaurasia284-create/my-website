<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91 CLUB</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginPage" class="page active">

  <div class="auth-logo">
    <div class="circle">91</div>
    <h1>91<span>CLUB</span></h1>
    <p class="tagline">Win Big Every Day 🎉</p>
  </div>

  <div class="auth-card">

    <div class="auth-tabs">
      <div class="auth-tab active">OTP Login</div>
    </div>

    <div class="auth-field">
      <label>📱 Phone Number</label>
      <input type="tel" id="phone" placeholder="+91 9876543210">
    </div>

    <button class="auth-btn" id="sendOtpBtn">
      Send OTP →
    </button>

    <div id="otpSection" style="display:none; margin-top:16px;">

      <div class="auth-field">
        <label>🔐 Enter OTP</label>
        <input type="number" id="otp" placeholder="Enter OTP">
      </div>

      <button class="auth-btn" id="verifyOtpBtn">
        Verify OTP →
      </button>

    </div>

    <div id="recaptcha-container"></div>

    <div class="ref-hint">
      Secure Firebase OTP Verification
    </div>

  </div>

</div>

<div id="gamePage" class="page">

  <div class="header">
    <div class="header-logo">
      <div class="logo-c">91</div>
      91<span style="color:#f59e0b">CLUB</span>
    </div>
  </div>

  <div class="wallet-card">
    <div class="w-label">
      <span class="w-dot"></span>
      Wallet Balance
    </div>

    <div class="w-amount">
      <span class="rsym">₹</span>
      0.00
    </div>
  </div>

  <div class="welcome-box">
    ✅ Login Successful
  </div>

</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
